[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-insight"
version = "0.1.0"
description = "Reproducible chest X-ray research and report-generation experiments"
requires-python = ">=3.11"
dependencies = []

# Heavy, optional stacks. Core utilities and the test suite need none of them.
# "vlm" needs a CUDA GPU and Python 3.11/3.12 (e.g. Colab); the legacy notebooks
# pinned transformers==4.53.2 — record exact versions with every reported run.
[project.optional-dependencies]
imaging = ["numpy", "pillow"]
classifier = ["numpy", "pillow", "tensorflow"]
vlm = ["pillow", "torch", "transformers", "unsloth"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cxr-data = "cxr_insight.data:main"
