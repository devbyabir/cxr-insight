name: tests
on: [push, pull_request]
jobs:
  core:
    # Stdlib-only modules: must pass with no optional dependencies installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  full:
    # CPU torch so the CNN, training-resume and demo tests run too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
