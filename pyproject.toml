[project]
name = "cxr-insight"
version = "0.1.0"
description = "Reproducible chest X-ray research and report-generation experiments"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cxr-data = "cxr_insight.data:main"
